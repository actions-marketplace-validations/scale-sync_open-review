name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check packaged Action without dependencies
        run: GITHUB_EVENT_NAME=workflow_dispatch node action/dist/index.mjs

      - name: Check packaged Go executable
        run: |
          printf '%s' '{"contractVersion":2,"mode":"branch","repoRoot":"ci/repo","diff":"","files":[],"changes":[]}' |
            action/bin/open-review-linux-amd64 review-json |
            grep '"status":"empty"'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test ./...
      - run: bash integrations/ci/test.sh
      - run: go vet ./...

      - name: Build checksummed binary assets
        if: startsWith(github.ref_name, 'v1.12.')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash integrations/release/build.sh "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: _plan_docs/releases/${{ github.ref_name }}.md
          files: dist/release/*

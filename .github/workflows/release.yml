name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Check packaged Action without dependencies
        run: GITHUB_EVENT_NAME=workflow_dispatch node action/dist/index.mjs

      - name: Check packaged Go executable
        run: |
          printf '%s' '{"contractVersion":2,"mode":"branch","repoRoot":"ci/repo","diff":"","files":[],"changes":[]}' |
            action/bin/open-review-linux-amd64 review-json |
            grep '"status":"empty"'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test ./...
      - run: bash integrations/ci/test.sh
      - run: go vet ./...

      - name: Build SDK packages
        run: |
          pnpm --filter @openreview/sdk build
          python -m pip install build twine
          python -m build sdk/python
          cargo package --manifest-path sdk/rust/Cargo.toml --allow-dirty

      - name: Publish Rust SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish --manifest-path sdk/rust/Cargo.toml --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --dir sdk/typescript publish --access public --no-git-checks

      - name: Publish Python SDK
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_USERNAME: __token__
        run: python -m twine upload sdk/python/dist/*

      - name: Release Go SDK through tagged module
        run: |
          go test ./sdk/go
          test -n "$(git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"

      - name: Build checksummed binary assets
        if: startsWith(github.ref_name, 'v1.12.')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash integrations/release/build.sh "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: _plan_docs/releases/${{ github.ref_name }}.md
          files: dist/release/*

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Check packaged Action without dependencies
        run: GITHUB_EVENT_NAME=workflow_dispatch node action/dist/index.mjs

      - name: Check packaged Go executable
        run: |
          printf '%s' '{"contractVersion":2,"mode":"branch","repoRoot":"ci/repo","diff":"","files":[],"changes":[]}' |
            action/bin/open-review-linux-amd64 review-json |
            grep '"status":"empty"'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test ./...
      - run: bash integrations/ci/test.sh
      - run: go vet ./...

      - name: Build SDK packages
        run: |
          pnpm --dir sdk/typescript build
          python -m pip install build twine
          python -m build sdk/python
          cargo package --manifest-path sdk/rust/Cargo.toml --allow-dirty

      - name: Publish Rust SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if cargo info openreview-sdk@1.12.1 >/dev/null 2>&1; then
            echo 'openreview-sdk 1.12.1 is already published'
          else
            cargo publish --manifest-path sdk/rust/Cargo.toml --token "$CARGO_REGISTRY_TOKEN"
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: |
          if npm view @scalesync/open-review@1.12.1 version >/dev/null 2>&1; then
            echo '@scalesync/open-review 1.12.1 is already published'
          else
            npm publish --access public
          fi

      - name: Publish Python SDK
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_USERNAME: __token__
        run: |
          if python -c 'import urllib.request; urllib.request.urlopen("https://pypi.org/pypi/openreview-sdk/1.12.1/json")' >/dev/null 2>&1; then
            echo 'openreview-sdk 1.12.1 is already published'
          else
            python -m twine upload sdk/python/dist/*
          fi

      - name: Release Go SDK through tagged module
        run: |
          go test ./sdk/go
          test -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"

      - name: Build checksummed binary assets
        if: startsWith(env.RELEASE_TAG, 'v1.12.')
        run: RELEASE_VERSION="$RELEASE_TAG" bash integrations/release/build.sh "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: _plan_docs/releases/${{ env.RELEASE_TAG }}.md
          files: dist/release/*

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check packaged Action without dependencies
        run: GITHUB_EVENT_NAME=workflow_dispatch node action/dist/index.mjs

      - name: Check packaged Go executable
        run: |
          printf '%s' '{"contractVersion":2,"mode":"branch","repoRoot":"ci/repo","diff":"","files":[],"changes":[]}' |
            action/bin/open-review-linux-amd64 review-json |
            grep '"status":"empty"'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test ./...
      - run: go vet ./...

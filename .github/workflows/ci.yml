name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check packaged Action without dependencies
        run: GITHUB_EVENT_NAME=workflow_dispatch node action/dist/index.mjs

      - name: Check packaged Go executable
        run: |
          printf '%s' '{"contractVersion":2,"mode":"branch","repoRoot":"ci/repo","diff":"","files":[],"changes":[]}' |
            action/bin/open-review-linux-amd64 review-json |
            grep '"status":"empty"'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test ./...
      - run: bash integrations/ci/test.sh

      - run: bash integrations/agents/test.sh
      - run: go vet ./...

  editor-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test VS Code adapter
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test and package JetBrains adapter
        working-directory: extensions/jetbrains
        run: ./gradlew test buildPlugin --no-daemon

  sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: go build -o "$RUNNER_TEMP/open-review" ./cmd/open-review
      - run: go test ./sdk/go
      - run: pnpm --filter @openreview/sdk build
      - run: pnpm --filter @openreview/sdk test
        env:
          OPEN_REVIEW_BIN: ${{ runner.temp }}/open-review
      - run: python -m pip install build
      - run: python -m build sdk/python
      - run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests
        env:
          OPEN_REVIEW_BIN: ${{ runner.temp }}/open-review
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
        env:
          OPEN_REVIEW_BIN: ${{ runner.temp }}/open-review
      - run: cargo package --manifest-path sdk/rust/Cargo.toml --allow-dirty

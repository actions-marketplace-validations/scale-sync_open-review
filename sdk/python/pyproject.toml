[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openreview-sdk"
version = "1.12.1"
description = "Typed Python client for the open-review Go engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ScaleSync"}]

[tool.setuptools]
packages = ["openreview"]
